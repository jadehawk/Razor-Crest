name: Backfill BOOX Picco into Razor-Crest r10

# One-time repair of r10; never rebuild or replace the original seven firmware images.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: razor-crest-r10-picco-backfill
  cancel-in-progress: false

jobs:
  backfill-picco:
    name: Build and attach Picco to existing r10
    runs-on: ubuntu-latest
    env:
      TAG: razor-crest-v2.0.0-r10
      VERSION: 2.0.0-r10
      SOURCE_SHA: 2b7f1cf9f24f77ce0c7f9ffb4bb76e4477b26b4d
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release maintenance scripts
        uses: actions/checkout@v6
        with:
          path: release-tools
          fetch-depth: 0

      - name: Checkout exact r10 firmware source
        uses: actions/checkout@v6
        with:
          ref: razor-crest-v2.0.0-r10
          path: firmware
          fetch-depth: 0
          submodules: recursive

      - name: Confirm release source and existing assets
        run: |
          set -euo pipefail
          test "$(git -C firmware rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq '.isImmutable')" = false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[].name | select(startswith("razor-crest-") and endswith(".bin"))] | length' |
            grep -qx '7'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fxq "razor-crest-$VERSION-picco.bin"; then
            echo 'Picco already published; refusing to replace the firmware asset.' >&2
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install release build toolchain
        run: |
          set -euo pipefail
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: razor-crest-pio-${{ runner.os }}-picco-gh_release-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: razor-crest-pio-${{ runner.os }}-picco-gh_release-

      - name: Configure r10 firmware version
        run: |
          printf '[crosspoint]\nversion = 2.0.0-r10\n' > firmware/platformio.local.ini

      - name: Pin pioarduino core inside the platform penv
        working-directory: firmware
        run: |
          set -euo pipefail
          pio pkg install -e picco-gh_release
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Compile BOOX Picco only
        working-directory: firmware
        env:
          RAZOR_CREST_LCP_RELEASE_KEY: ${{ secrets.RAZOR_CREST_LCP_RELEASE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$RAZOR_CREST_LCP_RELEASE_KEY" ]; then
            export PLATFORMIO_BUILD_FLAGS="-DRAZOR_CREST_LCP_RELEASE_KEY=\\\"$RAZOR_CREST_LCP_RELEASE_KEY\\\""
          fi
          pio run -e picco-gh_release -j1 | tee pio.log

      - name: Download and validate original r10 assets
        working-directory: firmware
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          test "$(find dist -maxdepth 1 -type f -name "razor-crest-$VERSION-*.bin" | wc -l)" -eq 7
          test ! -e "dist/razor-crest-$VERSION-picco.bin"
          (cd dist && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("dist/release-manifest.json").read_text())
          assert meta["tag"] == "razor-crest-v2.0.0-r10"
          assert meta["version"] == "2.0.0-r10"
          assert meta["source_commit"] == "2b7f1cf9f24f77ce0c7f9ffb4bb76e4477b26b4d"
          assert set(meta["devices"]) == {
              "x3-x4", "sticky", "x4pro", "x4c", "papermono", "metalio-eink4", "eego-a4"}
          PY

      - name: Validate Picco and prepare updated metadata
        working-directory: firmware
        run: |
          set -euo pipefail
          cp .pio/build/picco-gh_release/firmware.bin "dist/razor-crest-$VERSION-picco.bin"
          python3 - <<'PY'
          from pathlib import Path
          import json
          image = Path("dist/razor-crest-2.0.0-r10-picco.bin")
          data = image.read_bytes()
          assert 64 * 1024 <= len(data) <= 0xE70000, "Image exceeds Picco stock app partition"
          assert data[0] == 0xE9, "Invalid ESP image magic"
          assert int.from_bytes(data[12:14], "little") == 9, "Not an ESP32-S3 application"
          path = Path("dist/release-manifest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["devices"]["picco"] = {"label": "BOOX Picco", "asset": image.name}
          assert len(payload["devices"]) == 8
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          (cd dist && sha256sum razor-crest-*.bin | sort -k2 > SHA256SUMS.txt)
          (cd dist && sha256sum --check SHA256SUMS.txt)
          python3 ../release-tools/scripts/release_notes.py \
            --channel stable --version "$VERSION" --tag "$TAG" \
            --source "$SOURCE_SHA" --repository "$GITHUB_REPOSITORY" \
            --base-version 2.0.0 --dist dist --output release-notes.md \
            --notice 'BOOX Picco was added to the existing r10 release; the original seven binaries were preserved.'

      - name: Upload missing firmware and refresh release metadata
        working-directory: firmware
        run: |
          set -euo pipefail
          gh release upload "$TAG" "dist/razor-crest-$VERSION-picco.bin" --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" dist/SHA256SUMS.txt dist/release-manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[].name | select(startswith("razor-crest-") and endswith(".bin"))] | length' |
            grep -qx '8'
          echo '## r10 Picco backfill complete' >> "$GITHUB_STEP_SUMMARY"
          echo 'Original seven images preserved; Picco and metadata published.' >> "$GITHUB_STEP_SUMMARY"
