name: Build Razor-Crest Release

# Public Razor-Crest firmware releases. Tags must point at a Razor-Crest commit
# and follow: razor-crest-v<upstream-version>-r<revision>
# Example: razor-crest-v1.6.5-r1
on:
  push:
    tags:
      - 'razor-crest-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Razor-Crest version (example: 1.6.5-r1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Validate Razor-Crest release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      base_version: ${{ steps.release.outputs.base_version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate release source and version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          base_version="$(sed -n 's/^version = //p' platformio.ini | head -n1)"
          if [ -z "$base_version" ]; then
            echo 'Unable to read [crosspoint] version from platformio.ini' >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = 'push' ]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#razor-crest-v}"
            if [ "$version" = "$tag" ]; then
              echo "Unexpected Razor-Crest tag: $tag" >&2
              exit 1
            fi
          else
            version="$DISPATCH_VERSION"
            tag="razor-crest-v${version}"
          fi

          escaped_base="${base_version//./\\.}"
          if ! printf '%s\n' "$version" | grep -Eq "^${escaped_base}-r[1-9][0-9]*$"; then
            echo "Version must match ${base_version}-rN (N >= 1); got: $version" >&2
            exit 1
          fi

          if ! grep -Fq '#define CROSSPOINT_FIRMWARE_ID "Razor-Crest"' src/util/FirmwareIdentity.h; then
            echo 'This source revision does not identify itself as Razor-Crest.' >&2
            exit 1
          fi

          source_sha="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

          {
            echo '## Razor-Crest release source'
            echo "- Version: $version"
            echo "- Upstream baseline: $base_version"
            echo "- Tag: $tag"
            echo "- Source: $source_sha"
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: Unit tests
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

  build:
    name: Build Razor-Crest ${{ matrix.device }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: gh_release
            device: x3-x4
            label: X3 / X4
          - pio_env: sticky-gh_release
            device: sticky
            label: Seeed reTerminal Sticky
          - pio_env: x4pro-gh_release
            device: x4pro
            label: X4 Pro
          - pio_env: x4c-gh_release
            device: x4c
            label: X4 Classic
          - pio_env: papermono-gh_release
            device: papermono
            label: Paper Mono
          - pio_env: metalio_eink4-gh_release
            device: metalio-eink4
            label: MetalIO EInk4
          - pio_env: eego_a4-gh_release
            device: eego-a4
            label: EEGO A4
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: razor-crest-pio-${{ runner.os }}-${{ matrix.pio_env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: razor-crest-pio-${{ runner.os }}-${{ matrix.pio_env }}-

      - name: Set Razor-Crest firmware version
        env:
          RAZOR_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cat > platformio.local.ini <<EOF
          [crosspoint]
          version = ${RAZOR_VERSION}
          EOF
          echo "Building Razor-Crest ${RAZOR_VERSION} for ${{ matrix.label }}"

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          pio pkg install -e "${{ matrix.pio_env }}"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build firmware
        run: |
          set -euo pipefail
          pio run -e "${{ matrix.pio_env }}" -j1 | tee pio.log

      - name: Prepare firmware asset
        id: asset
        env:
          RAZOR_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          asset="razor-crest-${RAZOR_VERSION}-${{ matrix.device }}.bin"
          cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" "$asset"
          echo "name=$asset" >> "$GITHUB_OUTPUT"

          ram_line="$(grep -E 'RAM:\\s' -m1 pio.log || true)"
          flash_line="$(grep -E 'Flash:\\s' -m1 pio.log || true)"
          {
            echo "## ${{ matrix.label }}"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.asset.outputs.name }}
          path: ${{ steps.asset.outputs.name }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish Razor-Crest release
    needs:
      - prepare
      - unit-tests
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: razor-crest-*.bin
          merge-multiple: true

      - name: Verify assets and generate metadata
        env:
          RAZOR_VERSION: ${{ needs.prepare.outputs.version }}
          RAZOR_TAG: ${{ needs.prepare.outputs.tag }}
          BASE_VERSION: ${{ needs.prepare.outputs.base_version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail

          for device in x3-x4 sticky x4pro x4c papermono metalio-eink4 eego-a4; do
            test -f "dist/razor-crest-${RAZOR_VERSION}-${device}.bin"
          done
          test "$(find dist -maxdepth 1 -type f -name 'razor-crest-*.bin' | wc -l)" -eq 7

          (cd dist && sha256sum razor-crest-*.bin | sort -k2 > SHA256SUMS.txt)

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          dist = Path('dist')
          version = os.environ['RAZOR_VERSION']
          devices = {
              'x3-x4': 'X3 / X4',
              'sticky': 'Seeed reTerminal Sticky',
              'x4pro': 'X4 Pro',
              'x4c': 'X4 Classic',
              'papermono': 'Paper Mono',
              'metalio-eink4': 'MetalIO EInk4',
              'eego-a4': 'EEGO A4',
          }
          payload = {
              'firmware': 'Razor-Crest',
              'firmware_family': 'crosspoint',
              'firmware_id': 'Razor-Crest',
              'version': version,
              'tag': os.environ['RAZOR_TAG'],
              'upstream_base_version': os.environ['BASE_VERSION'],
              'source_commit': os.environ['SOURCE_SHA'],
              'devices': {
                  key: {
                      'label': label,
                      'asset': f'razor-crest-{version}-{key}.bin',
                  }
                  for key, label in devices.items()
              },
          }
          (dist / 'release-manifest.json').write_text(
              json.dumps(payload, indent=2) + '\n', encoding='utf-8'
          )
          PY

          short_sha="${SOURCE_SHA:0:7}"
          cat > release-notes.md <<EOF
          Public Razor-Crest firmware based on CrossPoint ${BASE_VERSION}.

          **Razor-Crest version:** ${RAZOR_VERSION}  
          **Source commit:** \`${short_sha}\`

          ### Firmware downloads

          | Device | Asset |
          | --- | --- |
          | X3 / X4 | \`razor-crest-${RAZOR_VERSION}-x3-x4.bin\` |
          | Seeed reTerminal Sticky | \`razor-crest-${RAZOR_VERSION}-sticky.bin\` |
          | X4 Pro | \`razor-crest-${RAZOR_VERSION}-x4pro.bin\` |
          | X4 Classic | \`razor-crest-${RAZOR_VERSION}-x4c.bin\` |
          | Paper Mono | \`razor-crest-${RAZOR_VERSION}-papermono.bin\` |
          | MetalIO EInk4 | \`razor-crest-${RAZOR_VERSION}-metalio-eink4.bin\` |
          | EEGO A4 | \`razor-crest-${RAZOR_VERSION}-eego-a4.bin\` |

          Use the firmware file that matches your device. `SHA256SUMS.txt` contains checksums for every binary, and `release-manifest.json` provides the same release information in machine-readable form.
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RAZOR_VERSION: ${{ needs.prepare.outputs.version }}
          RAZOR_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          if gh release view "$RAZOR_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RAZOR_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Razor-Crest ${RAZOR_VERSION}" \
              --notes-file release-notes.md
          else
            gh release create "$RAZOR_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Razor-Crest ${RAZOR_VERSION}" \
              --notes-file release-notes.md
          fi

          gh release upload "$RAZOR_TAG" \
            dist/razor-crest-*.bin \
            dist/SHA256SUMS.txt \
            dist/release-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
