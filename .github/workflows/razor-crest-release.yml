name: Build Razor-Crest Stable Release

# Stable releases run on Razor-Crest tags or explicit manual requests.
on:
  push:
    tags:
      - 'razor-crest-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version; blank picks next base-rN'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref || 'razor-crest-manual-release' }}
  cancel-in-progress: false

jobs:
  firmware:
    name: Build and test stable firmware
    uses: ./.github/workflows/razor-crest-build.yml
    permissions:
      contents: read
      pages: read
    with:
      channel: stable
      version: ${{ inputs.version || '' }}
    secrets: inherit

  publish:
    name: Publish Razor-Crest stable release
    needs: firmware
    if: needs.firmware.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download firmware assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: razor-crest-*.bin
          merge-multiple: true

      - name: Verify assets and generate metadata
        env:
          RAZOR_VERSION: ${{ needs.firmware.outputs.version }}
          RAZOR_TAG: ${{ needs.firmware.outputs.tag }}
          BASE_VERSION: ${{ needs.firmware.outputs.base_version }}
          SOURCE_SHA: ${{ needs.firmware.outputs.source_sha }}
        run: |
          set -euo pipefail

          for device in x3-x4 sticky x4pro x4c papermono metalio-eink4 eego-a4 picco; do
            test -f "dist/razor-crest-${RAZOR_VERSION}-${device}.bin"
          done
          test "$(find dist -maxdepth 1 -type f -name 'razor-crest-*.bin' | wc -l)" -eq 8

          (cd dist && sha256sum razor-crest-*.bin | sort -k2 > SHA256SUMS.txt)

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          dist = Path('dist')
          version = os.environ['RAZOR_VERSION']
          devices = {
              'x3-x4': 'X3 / X4',
              'sticky': 'Seeed reTerminal Sticky',
              'x4pro': 'X4 Pro',
              'x4c': 'X4 Classic',
              'papermono': 'Paper Mono',
              'metalio-eink4': 'MetalIO EInk4',
              'eego-a4': 'EEGO A4',
              'picco': 'BOOX Picco',
          }
          payload = {
              'firmware': 'Razor-Crest',
              'firmware_family': 'crosspoint',
              'firmware_id': 'Razor-Crest',
              'version': version,
              'tag': os.environ['RAZOR_TAG'],
              'upstream_base_version': os.environ['BASE_VERSION'],
              'source_commit': os.environ['SOURCE_SHA'],
              'devices': {
                  key: {
                      'label': label,
                      'asset': f'razor-crest-{version}-{key}.bin',
                  }
                  for key, label in devices.items()
              },
          }
          (dist / 'release-manifest.json').write_text(
              json.dumps(payload, indent=2) + '\n', encoding='utf-8'
          )
          PY

          python3 scripts/release_notes.py \
            --channel stable --version "$RAZOR_VERSION" --tag "$RAZOR_TAG" \
            --source "$SOURCE_SHA" --repository "$GITHUB_REPOSITORY" \
            --base-version "$BASE_VERSION" --dist dist --output release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RAZOR_VERSION: ${{ needs.firmware.outputs.version }}
          RAZOR_TAG: ${{ needs.firmware.outputs.tag }}
          SOURCE_SHA: ${{ needs.firmware.outputs.source_sha }}
        run: |
          set -euo pipefail
          if gh release view "$RAZOR_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RAZOR_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Razor-Crest ${RAZOR_VERSION}" \
              --notes-file release-notes.md
          else
            gh release create "$RAZOR_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Razor-Crest ${RAZOR_VERSION}" \
              --notes-file release-notes.md
          fi

          gh release upload "$RAZOR_TAG" \
            dist/razor-crest-*.bin \
            dist/SHA256SUMS.txt \
            dist/release-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
